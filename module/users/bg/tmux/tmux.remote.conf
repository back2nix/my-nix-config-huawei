# Удалённая сессия: голубой акцент вместо зелёного и маркер хоста слева.
# Фон панелей не трогаем (иначе пропадает прозрачность терминала).
set -g status-position bottom

set -g status-style "fg=#aab2bf,bg=#2c313a"

set -g status-left "#[fg=#282c34,bg=#61afef,bold] 󰒋 #h #[fg=#61afef,bg=#2c313a,nobold] #[fg=#5c6370]#S "
set -g status-right "#[fg=#5c6370]%R "
set -g window-status-style "fg=#5c6370,bg=#2c313a"
set -g window-status-current-format "#[fg=#61afef,bg=#3e4452] #I #[fg=#aab2bf,bold]#W #[default]"
set -g window-status-format "#[fg=#5c6370] #I #W "

set -g pane-active-border-style "fg=#61afef"
set -g pane-border-style "fg=#3e4452"
